# Conda environment for PC2 Noctua 2 (H100, driver 595.x -> CUDA 13 capable).
# Matches the stack the README reports as tested: torch 2.12 / PyG 2.8 / CUDA 13.
# No PyG C++ extensions (torch-spline-conv, pyg-lib, torch-scatter) are needed.
# Create/update with: bash hpc/create_environment.sh
name: rational-basis-cnn
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24
  - pip:
      - --extra-index-url=https://download.pytorch.org/whl/cu130
      - torch==2.12.0+cu130
      - torchvision==0.27.0+cu130
      - torch_geometric>=2.8,<2.9
      - numpy>=1.26,<3
      - scipy>=1.11,<2
      - plyfile>=1.0,<2
      - pytest>=8,<9
      - wandb>=0.17            # optional: WANDB=1 slurm/submit.sh ...
